name: Bundle Size Analyzer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read # for checkout repository
      actions: read # for fetching base branch bundle stats
      pull-requests: write # for comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Prepare build env
        run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_BASE_URL="http://localhost:8787"
          NEXT_PUBLIC_R2_URL="/api/r2"
          NEXT_PUBLIC_GENERATION_INTERVAL_MS="600000"
          RUNWARE_API_KEY="dummy_runware_api_key"
          EOF
          cp wrangler.toml wrangler.ci.toml
          perl -0pi -e 's/remote = true/remote = false/g' wrangler.ci.toml

      - name: Build with opennextjs-cloudflare
        run: DOOM_ENABLE_SERVER_BUNDLE_STUBS=1 opennextjs-cloudflare build --config wrangler.ci.toml && bun run patch:setimmediate

      - name: Analyze esbuild bundle size
        uses: exoego/esbuild-bundle-analyzer@v1
        with:
          metafiles: ".open-next/server-functions/default/handler.mjs.meta.json"
          name: doom-index
          analyze_directory: .analyzer
          include_extensions: .js,.cjs,.mjs
          percent_extra_attention: 20
          include_size_comparison: added,deleted,increased,decreased,no-change
          show_details: true
          top_n_largest_paths: 20
